<!-- Snake game with expand/collapse button, 11x11 board -->
<!-- Drop this into any page. Self-contained: HTML + CSS + JS. -->

<style>
  .snake-widget-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    cursor: pointer;
  }
  .snake-widget-btn:hover { background: #f1efe8; }
  #snakeGamePanel {
    display: none;
    margin-top: 12px;
    max-width: 340px;
  }
  #snakeGamePanel .card {
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 12px;
    padding: 1rem;
  }
  #snakeGamePanel .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
  }
  #snakeGamePanel button.small {
    padding: 4px 10px;
    font-size: 13px;
    border: 1px solid #d3d1c7;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  #snakeGamePanel canvas {
    display: block;
    border-radius: 8px;
    background: #f1efe8;
  }
  #snakeStatus {
    font-size: 13px;
    color: #5f5e5a;
    margin: 8px 0 0;
    text-align: center;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(2, 36px);
    gap: 4px;
    justify-content: center;
    margin-top: 10px;
  }
  .dpad button {
    border: 1px solid #d3d1c7;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
</style>

<div style="display: flex; justify-content: flex-start;">
  <button id="toggleBtn" class="snake-widget-btn">
    <span id="btnLabel">Play snake</span>
  </button>
</div>

<div id="snakeGamePanel">
  <div class="card">
    <div class="top-row">
      <span>Score: <strong id="score">0</strong></span>
      <button id="restartBtn" class="small">Restart</button>
    </div>
    <canvas id="board" width="264" height="264"></canvas>
    <p id="snakeStatus">Use arrow keys, WASD, or the buttons below</p>
    <div class="dpad">
      <div></div>
      <button id="up" aria-label="up">&#8593;</button>
      <div></div>
      <button id="left" aria-label="left">&#8592;</button>
      <button id="down" aria-label="down">&#8595;</button>
      <button id="right" aria-label="right">&#8594;</button>
    </div>
  </div>
</div>

<script>
(function() {
  const N = 11;
  const cell = 264 / N;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('snakeStatus');
  const colors = {
    bg: '#f1efe8',
    snake: '#0F6E56',
    head: '#085041',
    food: '#D85A30',
    grid: '#d3d1c7'
  };

  let snake, dir, nextDir, food, score, alive, timer;

  function reset() {
    snake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    alive = true;
    scoreEl.textContent = '0';
    statusEl.textContent = 'Use arrow keys, WASD, or the buttons below';
    placeFood();
    draw();
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 220);
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)};
      valid = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N || snake.some(s => s.x===head.x && s.y===head.y)) {
      alive = false;
      clearInterval(timer);
      statusEl.textContent = 'Game over — final score ' + score;
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = String(score);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, 264, 264);
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= N; i++) {
      ctx.beginPath(); ctx.moveTo(i*cell, 0); ctx.lineTo(i*cell, 264); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*cell); ctx.lineTo(264, i*cell); ctx.stroke();
    }
    ctx.fillStyle = colors.food;
    ctx.beginPath();
    ctx.arc(food.x*cell + cell/2, food.y*cell + cell/2, cell*0.35, 0, Math.PI*2);
    ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? colors.head : colors.snake;
      ctx.fillRect(s.x*cell + 1, s.y*cell + 1, cell - 2, cell - 2);
    });
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = {x, y};
  }

  document.addEventListener('keydown', (e) => {
    const panel = document.getElementById('snakeGamePanel');
    if (panel.style.display === 'none' || !panel.style.display) return;
    const key = e.key.toLowerCase();
    if (key === 'arrowup' || key === 'w') { setDir(0,-1); e.preventDefault(); }
    else if (key === 'arrowdown' || key === 's') { setDir(0,1); e.preventDefault(); }
    else if (key === 'arrowleft' || key === 'a') { setDir(-1,0); e.preventDefault(); }
    else if (key === 'arrowright' || key === 'd') { setDir(1,0); e.preventDefault(); }
  });

  document.getElementById('up').addEventListener('click', () => setDir(0,-1));
  document.getElementById('down').addEventListener('click', () => setDir(0,1));
  document.getElementById('left').addEventListener('click', () => setDir(-1,0));
  document.getElementById('right').addEventListener('click', () => setDir(1,0));
  document.getElementById('restartBtn').addEventListener('click', reset);

  const toggleBtn = document.getElementById('toggleBtn');
  const btnLabel = document.getElementById('btnLabel');
  const panel = document.getElementById('snakeGamePanel');
  let expanded = false;

  toggleBtn.addEventListener('click', () => {
    expanded = !expanded;
    panel.style.display = expanded ? 'block' : 'none';
    btnLabel.textContent = expanded ? 'Close snake' : 'Play snake';
    if (expanded) reset();
    else if (timer) clearInterval(timer);
  });
})();
</script>
